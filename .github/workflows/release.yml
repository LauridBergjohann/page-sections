name: Release packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check trusted publishing setup
        run: |
          if [ '${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}' != 'true' ]; then
            echo '::error::Configure npm trusted publishers and the npm environment first. See docs/development/releasing.md.'
            exit 1
          fi
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:website
      - run: npm run release:publish
      - run: npm run verify:published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-consumer
          path: |
            .artifacts/
            test-results/
